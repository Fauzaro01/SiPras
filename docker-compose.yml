services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sipras-app
    restart: unless-stopped
    ports:
      - "5656:5656"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:5656
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/storage/database/database.sqlite
      RUN_MIGRATIONS: "true"
    volumes:
      - app-storage:/var/www/storage
    networks:
      - sipras-net

volumes:
  app-storage:

networks:
  sipras-net:
    driver: bridge
